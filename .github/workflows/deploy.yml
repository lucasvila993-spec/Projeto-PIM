# Deploy automatico: a cada push no main, monta o site e publica no GitHub Pages.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; um push novo cancela o que ainda estiver esperando
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Montar o site com as rotas /home, /entrar, /paciente e /admin
        run: node scripts/build-pages.js
        env:
          BASE: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}home/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
